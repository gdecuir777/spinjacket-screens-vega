name: Build SpinJacket Screens (Vega)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      APPLY_WEBVIEW: ${{ vars.APPLY_WEBVIEW || 'false' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Vega SDK, scaffold, and build
        shell: bash
        run: |
          export NONINTERACTIVE=true
          export SKIP_VVD_INSTALL=true
          echo "=== Installing latest Vega SDK ==="
          curl -fsSL https://sdk-installer.vega.labcollab.net/get_vvm.sh | bash || true
          source "$HOME/vega/env" 2>/dev/null || true
          export PATH="$HOME/vega/bin:$PATH"
          echo "=== Available remote SDK versions ==="
          vega sdk list-remote || true
          echo "=== Active vega ==="
          vega --version || true
          set -eo pipefail
          echo "=== Generating starter app (helloWorld) ==="
          rm -rf app
          vega project generate --template helloWorld --name SpinJacketScreens --packageId com.spinjacket.screens --outputDir app
          echo "=== File tree ==="
          find app -type f -not -path '*/node_modules/*' | sort
          if [ "${APPLY_WEBVIEW}" = "true" ] && [ -f webview-app/App.tsx ]; then
            cp webview-app/App.tsx app/src/App.tsx
            ( cd app && npm install @amazon-devices/webview@latest || true )
          fi
          echo "=== Building ==="
          cd app
          vega project update-manifest --os-min 2.0 --os-version 2.0 || true
          vega project install --fix || true
          npm install
          vega project doctor || true
          npx react-native build-vega
          echo "=== Build output ==="
          find . -name '*.vpkg' -not -path '*/node_modules/*' | sort

      - name: Upload build + source layout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spinjacket-screens-vega
          path: |
            app/**/*.vpkg
            app/manifest.toml
            app/src/**
            app/package.json
            app/index.*
          if-no-files-found: warn
